graphs:
- schema: embodiment_graph/v2
  graph_id: observation
  name: Observation Graph (full_humanoid profile)
  intent: Observe and describe the environment using available sensors and actuators,
    within the active safety profile.
  safety_level: full_humanoid
  active_safety_profile: full_humanoid
  roles:
  - role_id: robot_local_view
    description: Ego/first-person view from a robot-mounted sensor.
    required_capabilities:
    - observe
    preferred_nodes:
    - g1_real_sensor_only
    - g1_realsense_color_sensor
    minimum: 0
    maximum: 9999
  - role_id: external_view
    description: Third-person view from an external camera.
    required_capabilities:
    - observe
    preferred_nodes:
    - camera_usb_real
    - usb_camera_real
    minimum: 0
    maximum: 9999
  - role_id: audio_input
    description: Microphone for audio capture (capture only, never output).
    required_capabilities:
    - listen
    preferred_nodes:
    - g1_real_sensor_only
    - usb_mic_real
    minimum: 0
    maximum: 9999
  - role_id: perception_model
    description: Runtime-provided VLM/perception model.
    required_capabilities:
    - image_understanding
    minimum: 1
    maximum: 1
  nodes:
  - id: camera_usb_real
    role: external_view
    node_type: sensor
    required_capabilities:
    - observe
  - id: g1_real_sensor_only
    role: robot_local_view
    node_type: physical_robot
    required_capabilities:
    - observe
  - id: g1_realsense_color_sensor
    role: robot_local_view
    node_type: sensor
    required_capabilities:
    - observe
  - id: usb_camera_real
    role: external_view
    node_type: sensor
    required_capabilities:
    - observe
  - id: usb_mic_real
    role: audio_input
    node_type: sensor
    required_capabilities:
    - listen
  - id: perception_vision
    role: perception_model
    node_type: perception_model
    required_capabilities:
    - image_understanding
  edges:
  - source: camera_usb_real
    target: perception_vision
    edge_type: observation_stream
  - source: g1_real_sensor_only
    target: perception_vision
    edge_type: observation_stream
  - source: g1_realsense_color_sensor
    target: perception_vision
    edge_type: observation_stream
  - source: usb_camera_real
    target: perception_vision
    edge_type: observation_stream
  constraints:
    allow_motion: true
    allow_manipulation: true
    allow_audio_output: true
    forbidden_actions: &id001 []
  readiness_checks:
  - all_required_nodes_exist
  - required_capabilities_are_safe
  - sensor_artifacts_available_or_capture_allowed
  - no_forbidden_action_in_task
  - user_confirmed_motion_in_scope
  - supervisor_signoff_obtained
  - audio_rms_non_zero_or_explicitly_unverified
  failure_modes:
  - id: node_missing
    when: required node id not in topology
    attribution: topology
  - id: node_offline
    when: adapter/endpoint unreachable
    attribution: hardware
  - id: capability_missing
    when: node lacks a required capability
    attribution: configuration
  - id: forbidden_action_requested
    when: task action is in forbidden_actions for active profile
    attribution: planner
  - id: sensor_artifact_missing
    when: frame/audio file not produced
    attribution: sensor
  - id: missing_confirmation
    when: motion/manipulation planned without prior user confirmation
    attribution: planner
  - id: unverified_audio_pickup
    when: audio captured but RMS=0 or speech absent
    attribution: sensor
  recovery:
    auto_allowed:
    - retry_passive_health_check
    - choose_alternate_observer
    - downgrade_multiview_to_single_view
    requires_confirmation:
    - audio_output
    - manipulation
    - motion
    not_recoverable:
    - missing_capable_executor
  outputs:
  - scene_description
  - motion_trace
  - manipulation_trace
  - audio_pickup_status
  - sensor_readiness_report
  - failure_attribution
  - episode_trace
safety:
  active_safety_profile: full_humanoid
  default_policy: sensor_only
  install_must_not_actuate: true
  requires_confirmation_for:
  - audio_output
  - manipulation
  - motion
  forbidden_actions: *id001
integration:
  exposes_agent_context: true
  compatible_with:
  - auwomo_physclaw
  - openclaw_like_runtime
